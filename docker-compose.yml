x-moodle-common-env: &moodle_common_env
  MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
  MOODLE_DBTYPE: ${MOODLE_DBTYPE:-mysqli}
  MOODLE_DBHOST: ${MOODLE_DBHOST:-db}
  MOODLE_DBNAME: ${MOODLE_DBNAME:-moodle}
  MOODLE_DBUSER: ${MOODLE_DBUSER:-moodle}
  MOODLE_DBPASSWORD: ${MOODLE_DBPASSWORD:-moodle}
  MOODLE_REDIS_HOST: ${MOODLE_REDIS_HOST:-redis}
  MOODLE_REVERSEPROXY: ${MOODLE_REVERSEPROXY:-"0"}
  MOODLE_SSLPROXY: ${MOODLE_SSLPROXY:-"0"}
  MOODLE_ROUTERCONFIGURED: ${MOODLE_ROUTERCONFIGURED:-"0"}

x-moodle-install-env: &moodle_install_env
  MOODLE_RUN_INSTALL: ${MOODLE_RUN_INSTALL:-"0"}
  MOODLE_RUN_UPGRADE: ${MOODLE_RUN_UPGRADE:-"0"}
  MOODLE_SITE_FULLNAME: ${MOODLE_SITE_FULLNAME:-"moodle"}
  MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-"moodle"}
  MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-"admin"}
  MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-"change-me"}
  MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-"admin@example.com"}

services:
  db:
    image: mysql:8.0.42
    environment:
      MYSQL_DATABASE: ${MOODLE_DBNAME:-moodle}
      MYSQL_USER: ${MOODLE_DBUSER:-moodle}
      MYSQL_PASSWORD: ${MOODLE_DBPASSWORD:-moodle}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ${DBDATA_SOURCE:-dbdata}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Postgres variant (kept for later migration testing):
  # db:
  #   image: postgres:13-alpine
  #   environment:
  #     POSTGRES_DB: ${MOODLE_DBNAME:-moodle}
  #     POSTGRES_USER: ${MOODLE_DBUSER:-moodle}
  #     POSTGRES_PASSWORD: ${MOODLE_DBPASSWORD:-moodle}
  #   volumes:
  #     - ${DBDATA_SOURCE:-dbdata}:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  redis:
    image: redis:7-alpine

  moodle:
    image: moodle-php
    build:
      context: .
      dockerfile: php/Dockerfile
      args:
        MOODLE_SERIES: stable311
        MOODLE_VERSION: 3.11.18
        MOODLE_THEME_ADAPTABLE_ZIP_URL: ${MOODLE_THEME_ADAPTABLE_ZIP_URL:-https://moodle.org/plugins/download.php/27987/theme_adaptable_moodle311_2021081009.zip}
        MOODLE_LOCAL_PROFILECOHORT_ZIP_URL: ${MOODLE_LOCAL_PROFILECOHORT_ZIP_URL:-https://moodle.org/plugins/download.php/27301/local_profilecohort_moodle311_2021061303.zip}
        MOODLE_LOCAL_CNW_SMARTCOHORT_ZIP_URL: ${MOODLE_LOCAL_CNW_SMARTCOHORT_ZIP_URL:-https://moodle.org/plugins/download.php/19488/local_cnw_smartcohort_moodle39_2019050603.zip}
        MOODLE_BLOCK_COURSEFEEDBACK_ZIP_URL: ${MOODLE_BLOCK_COURSEFEEDBACK_ZIP_URL:-https://github.com/Moodle-Course-Evaluations-MCE/moodle-block_coursefeedback/archive/refs/tags/v3.1.2.zip}
    environment:
      <<: [*moodle_common_env, *moodle_install_env]
    volumes:
      - ${MOODLEDATA_SOURCE:-moodledata}:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy

  # Optional one-shot upgrade on container startup:
  #   MOODLE_RUN_UPGRADE=1 docker compose up -d --force-recreate moodle
  # (Defaults to 0 if not provided.)

  cron:
    image: moodle-php
    environment:
      <<: *moodle_common_env
      MOODLE_RUN_INSTALL: "0"
    volumes:
      - ${MOODLEDATA_SOURCE:-moodledata}:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "MARKER=\"${MOODLE_DATAROOT:-/var/www/moodledata}/.moodle_installed\"; while [ ! -f \"$$MARKER\" ]; do echo \"Waiting for Moodle install to complete ($$MARKER)\"; sleep 10; done; while true; do php /var/www/html/admin/cli/upgrade.php --is-pending >/dev/null 2>&1; RC=$$?; if [ $$RC -eq 2 ]; then echo 'Moodle upgrade pending, cron execution suspended.'; sleep 30; continue; fi; if [ $$RC -ne 0 ]; then echo 'Error checking upgrade status; retrying.'; sleep 30; continue; fi; break; done; while true; do php /var/www/html/admin/cli/cron.php; sleep 60; done"]

  nginx:
    image: moodle-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        MOODLE_SERIES: stable311
        MOODLE_VERSION: 3.11.18
        MOODLE_THEME_ADAPTABLE_ZIP_URL: ${MOODLE_THEME_ADAPTABLE_ZIP_URL:-https://moodle.org/plugins/download.php/27987/theme_adaptable_moodle311_2021081009.zip}
        MOODLE_LOCAL_PROFILECOHORT_ZIP_URL: ${MOODLE_LOCAL_PROFILECOHORT_ZIP_URL:-https://moodle.org/plugins/download.php/27301/local_profilecohort_moodle311_2021061303.zip}
        MOODLE_LOCAL_CNW_SMARTCOHORT_ZIP_URL: ${MOODLE_LOCAL_CNW_SMARTCOHORT_ZIP_URL:-https://moodle.org/plugins/download.php/19488/local_cnw_smartcohort_moodle39_2019050603.zip}
        MOODLE_BLOCK_COURSEFEEDBACK_ZIP_URL: ${MOODLE_BLOCK_COURSEFEEDBACK_ZIP_URL:-https://github.com/Moodle-Course-Evaluations-MCE/moodle-block_coursefeedback/archive/refs/tags/v3.1.2.zip}
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - moodle

volumes:
  dbdata:
  moodledata:
